{% extends "base.html" %}

{% block title %}Product editor{% endblock %}

{% block content %}

<div class="page-heading">

    <span class="eyebrow">PRODUCT CATALOGUE</span>

    <h1>
        {{ 'Edit product' if product else 'Add product' }}
    </h1>

</div>

<form
    class="panel form-panel narrow"
    method="post"
    enctype="multipart/form-data"
>

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <label>
        Product name
        <input
            name="name"
            required
            value="{{ product.name if product else '' }}"
        >
    </label>

    <label>
        Category
        <input
            name="category"
            required
            placeholder="Fruits, Vegetables, Dairy..."
            value="{{ product.category if product else '' }}"
        >
    </label>

    <label>
        Description
        <textarea name="description" rows="2">{{ product.description if product else '' }}</textarea>
    </label>

    <div class="two-col">

        <label>
            Unit
            <input
                name="unit"
                value="{{ product.unit if product else 'piece' }}"
                required
                placeholder="kg, litre, packet"
            >
        </label>

        <label>
            Stock quantity
            <input
                type="number"
                name="stock"
                min="0"
                required
                value="{{ product.stock if product else 0 }}"
            >
        </label>

    </div>

    <div class="two-col">

        <label>
            Original price (₹)
            <input
                type="number"
                name="price"
                min="0.01"
                step="0.01"
                required
                value="{{ product.price if product else '' }}"
            >
        </label>

        <label>
            Offer price (₹)
            <input
                type="number"
                name="discount_price"
                min="0.01"
                step="0.01"
                value="{{ product.discount_price if product and product.discount_price else '' }}"
            >
        </label>

    </div>

    <label>
        Product image
        <input
            type="file"
            name="image"
            accept=".png,.jpg,.jpeg,.webp"
        >
    </label>

    {% if product and product.image %}

        <img
            class="preview"
            src="{{ url_for('static', filename='uploads/' + product.image) }}"
        >

    {% endif %}

    <label class="check">

        <input
            type="checkbox"
            name="is_active"
            {% if not product or product.is_active %}checked{% endif %}
        >

        Show product in customer shop

    </label>

    <button class="btn full">
        Save product
    </button>

    <a class="text-link" href="{{ url_for('admin.dashboard') }}">
        Cancel
    </a>

</form>

{% endblock %}
