{% extends "base.html" %}{% block content %}<h1>Checkout</h1><div class="two"><form method="post" class="panel"><label>Full name<input name="customer_name" required></label><label>10-digit mobile number<input name="mobile" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required></label><label>Full delivery address<textarea name="address" rows="4" required></textarea></label><label>Payment method<select name="payment_method" required><option value="">Choose payment</option><option>Cash on Delivery</option><option>UPI on delivery</option></select></label><button>Place order</button></form><div class="panel"><h3>Order summary</h3>{% for item in items %}<p>{{ item.product.name }} × {{ item.quantity }} — ₹{{ '%.2f'|format(item.line_total) }}</p>{% endfor %}<hr><h2>Total: ₹{{ '%.2f'|format(total) }}</h2></div></div>{% endblock %}
