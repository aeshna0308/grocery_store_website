<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ shop_name }}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><header><a class="brand" href="{{ url_for('home') }}">{% if shop_logo %}<img class="shop-logo" src="{{ url_for('static', filename=shop_logo) }}" alt="{{ shop_name }} logo">{% endif %}{{ shop_name }}</a><nav><a href="{{ url_for('home') }}">Shop</a><a href="{{ url_for('cart') }}">Cart</a><a href="{{ url_for('admin_login') }}">Owner login</a></nav></header>
<main>{% with messages = get_flashed_messages() %}{% if messages %}<div class="messages">{% for m in messages %}<p>{{ m }}</p>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main>
<footer>{{ shop_name }} · Online grocery store</footer></body></html>
