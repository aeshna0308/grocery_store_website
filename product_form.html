{% extends "base.html" %}{% block content %}<h1>{% if product %}Edit product{% else %}Add product{% endif %}</h1><form method="post" enctype="multipart/form-data" class="panel narrow">
<label>Product name<input name="name" value="{{ product.name if product else '' }}" required></label><label>Description<textarea name="description">{{ product.description if product else '' }}</textarea></label><label>Category<input name="category" value="{{ product.category if product else '' }}" placeholder="Vegetables, fruits, dairy..."></label><label>Unit / quantity<input name="unit" value="{{ product.unit if product else '1 piece' }}" placeholder="1 kg, 500 g, 1 litre"></label><label>Original price (₹)<input type="number" step="0.01" min="0.01" name="price" value="{{ product.price if product else '' }}" required></label><label>Discount price (₹) — leave blank if no discount<input type="number" step="0.01" min="0.01" name="discount_price" value="{{ product.discount_price if product and product.discount_price else '' }}"></label><label>Available stock<input type="number" min="0" name="stock" value="{{ product.stock if product else 0 }}" required></label><label>Product image (PNG/JPG/WEBP, max 5 MB)<input type="file" name="image" accept=".png,.jpg,.jpeg,.webp"></label>{% if product and product.image %}<p>Current image: {{ product.image }}</p>{% endif %}<button>Save product</button></form>{% endblock %}
